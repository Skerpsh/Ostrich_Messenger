# coturn for Ostrich calls: relays a call's (encrypted) audio between
# devices that cannot reach each other directly. See deploy/README.md, "Calls:
# the TURN server". Copy to /etc/turnserver.conf and set the two CHANGE_ME.

listening-port=3478
# The relayed audio uses these UDP ports: open them in the firewall too.
min-port=49152
max-port=49352

# Logins made by the backend (calls.ts): the same secret as TURN_SECRET in
# apps/server/.env.
use-auth-secret
static-auth-secret=CHANGE_ME
realm=ostrich

# The server's public address, when it differs from the one coturn sees
# (e.g. behind NAT). Usually not needed on a VPS.
# external-ip=CHANGE_ME

fingerprint
stale-nonce=600
# Relays at once, in all and per login.
total-quota=200
user-quota=6

# Never relay into the server itself or private networks: a TURN login
# must not open a way into them.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-tlsv1
no-tlsv1_1
syslog
simple-log
