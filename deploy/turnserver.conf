# coturn for Ostrich calls: relays a call's (encrypted) audio between
# devices that cannot reach each other directly. See deploy/README.md, "Calls:
# the TURN server". Copy to /etc/turnserver.conf and set the two CHANGE_ME.

listening-port=3478
# The relayed audio uses these UDP ports: open them in the firewall too.
min-port=49152
max-port=49352

# Logins made by the backend (calls.ts): the same secret as TURN_SECRET in
# apps/server/.env.
use-auth-secret
static-auth-secret=CHANGE_ME
realm=ostrich

# The server's public address, when it differs from the one coturn sees
# (e.g. behind NAT). Usually not needed on a VPS.
# external-ip=CHANGE_ME

fingerprint
stale-nonce=600
# Relays at once, in all and per login.
total-quota=200
user-quota=6

# Never relay into the server itself or private networks: a TURN login
# must not open a way into them.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6 that leads back to IPv4 (or nowhere): ::, ::1 and the old
# IPv4-compatible ::a.b.c.d, IPv4-mapped ::ffff:a.b.c.d, NAT64 and 6to4,
# as coturn may not unwrap them before checking the IPv4 lines above.
denied-peer-ip=::-::ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# The server's own public addresses are not denied: a call where both
# devices go through this relay sends to them. So nothing on the server may
# listen on them but what is public anyway (PostgreSQL and Redis listen
# only on 127.0.0.1).

no-cli
no-tlsv1
no-tlsv1_1
syslog
simple-log
