name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For **security vulnerabilities**, please use
        [private reporting](https://github.com/Skerpsh/Ostrich_Messenger/security/advisories/new) instead.
  - type: dropdown
    id: client
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Web app
        - iOS app
        - Android app
        - Terminal client (CLI)
        - Backend / self-hosting
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "e.g. CLI v1.2.0 on Ubuntu 24.04, Firefox 140 on Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Do not include your OstrichID, password or message contents.
