# Publishes a release of every app when a version tag is pushed
# (git tag v1.3.0 && git push origin v1.3.0): the CLI for Linux, macOS and
# Windows, the Android app (an APK built with EAS) and the desktop app for
# Linux (AppImage, .deb, .rpm, .pacman, Flatpak) and Windows (an installer), all
# under the same version, with SHA-256 checksums and a table of what to
# download. The desktop app updates itself from these releases
# (latest*.yml).
#
# The Android build needs EXPO_TOKEN in the repository's secrets (Settings →
# Secrets and variables → Actions); without it the release has the CLI only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ostrich-$os-$arch"
            [ "$os" = windows ] && name="$name.exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$name" .
          done
          cp install.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: apps/cli/dist/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-web
    steps:
      # First: the steps run in apps/mobile-web, which only exists once
      # the code is checked out.
      - uses: actions/checkout@v4
      - name: Check for the Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set: the release will have no Android app"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.set == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-web/package-lock.json
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.set == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the APK with EAS, and publish the update over the air
        if: steps.token.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          # The app's version is the tag's (v1.3.0 → 1.3.0); EAS counts the
          # build number up by itself (eas.json, "github" profile).
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.expo.version = $v' app.json > app.json.new && mv app.json.new app.json
          # Not dist/: eas update exports the code there, emptying it first.
          mkdir -p apk
          # The native part's fingerprint (fingerprint.config.js leaves the
          # version out). The same as the last release's: its APK runs this
          # version's code too, over the air, so it is kept instead of
          # spending an EAS build.
          runtime=$(npx expo-updates runtimeversion:resolve --platform android | jq -r .runtimeVersion)
          echo "$runtime" > apk/android-runtime.txt
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$last" ] \
            && gh release download "$last" -p android-runtime.txt -O last-runtime.txt 2>/dev/null \
            && [ "$(cat last-runtime.txt)" = "$runtime" ] \
            && gh release download "$last" -p Ostrich-Android.apk -D apk; then
            echo "The native part is as in $last: its APK is kept"
          else
            eas build --platform android --profile github --non-interactive --wait --json > build.json
            url=$(jq -r '.[0].artifacts.buildUrl' build.json)
            curl -fsSL "$url" -o apk/Ostrich-Android.apk
          fi
          # The installed apps of this runtime get the code at their next
          # start (platform/app-update.ts); older ones are offered the APK.
          eas update --channel production --platform android --message "$GITHUB_REF_NAME" --non-interactive
      - uses: actions/upload-artifact@v4
        if: steps.token.outputs.set == 'true'
        with:
          name: android
          if-no-files-found: error
          path: |
            apps/mobile-web/apk/Ostrich-Android.apk
            apps/mobile-web/apk/android-runtime.txt

  # The desktop app: the web app built into it (apps/desktop/scripts/
  # build-web.mjs), packed by electron-builder. Its version is the tag's.
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
          (cd apps/mobile-web && npm ci)
          cd apps/desktop
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run web
          npx electron-builder --linux AppImage deb rpm pacman --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/dist/Ostrich-Linux.*
            apps/desktop/dist/latest-linux.yml

  # Flatpak needs the Flathub runtimes, a large download: when it fails,
  # the release goes out without it.
  desktop-flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          (cd apps/mobile-web && npm ci)
          cd apps/desktop
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run web
          npx electron-builder --linux flatpak --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak
          path: apps/desktop/dist/Ostrich-Linux.flatpak

  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          (cd apps/mobile-web && npm ci)
          cd apps/desktop
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run web
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/dist/Ostrich-Windows-Setup.exe
            apps/desktop/dist/Ostrich-Windows-Setup.exe.blockmap
            apps/desktop/dist/latest.yml

  publish:
    needs: [cli, android, desktop-linux, desktop-flatpak, desktop-windows]
    # The CLI is enough to publish; the apps join when they were built.
    if: ${{ !cancelled() && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # A link to a file of this release, if it was built.
          file() { [ -f "release/$1" ] && printf '[%s](%s/%s)' "$2" "$base" "$1"; }
          soon() { [ -n "$1" ] && printf '%s' "$1" || printf 'coming soon'; }
          android=$(soon "$(file Ostrich-Android.apk Ostrich-Android.apk)")
          windows=$(soon "$(file Ostrich-Windows-Setup.exe Ostrich-Windows-Setup.exe)")
          linux=$(soon "$(for f in AppImage deb rpm pacman flatpak; do file "Ostrich-Linux.$f" ".$f"; printf ' '; done | sed 's/  */ /g; s/ $//; s/) \[/), [/g')")
          cat > notes.md <<EOF
          ## Download

          | System | The app | Terminal (CLI) |
          |---|---|---|
          | **Android** | $android | |
          | **Windows** | $windows | [ostrich-windows-amd64.exe]($base/ostrich-windows-amd64.exe) |
          | **Linux** | $linux | [x86-64]($base/ostrich-linux-amd64), [ARM64]($base/ostrich-linux-arm64) or \`curl -fsSL $base/install.sh \| sh\` |
          | **macOS** | | [Apple silicon]($base/ostrich-darwin-arm64), [Intel]($base/ostrich-darwin-amd64) |
          | **iOS** | coming to the App Store | |
          | **Web** | [ostrich-messenger.online](https://ostrich-messenger.online), nothing to install | |

          - **Android:** open the APK on the phone and allow installing from that app when asked.
          - **Windows:** run the installer; Windows may warn about an unknown publisher: More info → Run anyway.
          - **Linux:** the AppImage runs anywhere (\`chmod +x Ostrich-Linux.AppImage\`, then open it); the \`.deb\` is for Ubuntu and Debian, the \`.rpm\` for Fedora and openSUSE, the \`.pacman\` for Arch (\`sudo pacman -U Ostrich-Linux.pacman\`). They all update themselves (the packages ask for your password to install the new version); the Flatpak does not yet.
          - **Updates:** the Android app gets new versions over the air at its next start, and offers a new APK when one is needed; the desktop apps install them themselves; the CLI replaces itself with the new version.

          Check a download with \`sha256sum -c SHA256SUMS\`.

          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand on GitHub (which also makes the tag) gets
        # the files added to it instead.
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Ostrich $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi
