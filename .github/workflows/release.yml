# Publishes a release of every app when a version tag is pushed
# (git tag v1.3.0 && git push origin v1.3.0): the CLI for Linux, macOS and
# Windows, the Android app (an APK built with EAS) and the desktop app for
# Linux (AppImage, .deb, .rpm, .pacman, Flatpak) and Windows (an installer), all
# under the same version, with SHA-256 checksums and a table of what to
# download. The desktop app updates itself from these releases
# (latest*.yml).
#
# The Android build needs EXPO_TOKEN in the repository's secrets (Settings →
# Secrets and variables → Actions); without it the release has the CLI only.
# RELEASE_SIGNING_KEY (an Ed25519 private key, PEM) signs SHA256SUMS: the
# CLI installs only releases signed with it (apps/cli/version.go).
#
# Actions are pinned to commits, and nothing is cached: a release runs only
# code this repository chose (security audit SEC-002).
name: Release

on:
  push:
    tags: ["v*"]

# Only the publish job writes (the release itself).
permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/cli/go.mod
          cache: false
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ostrich-$os-$arch"
            [ "$os" = windows ] && name="$name.exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$name" .
          done
          cp install.sh dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli
          path: apps/cli/dist/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-web
    steps:
      # First: the steps run in apps/mobile-web, which only exists once
      # the code is checked out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check for the Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set: the release will have no Android app"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.set == 'true'
        with:
          node-version: 22
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        if: steps.token.outputs.set == 'true'
        with:
          eas-version: 26.0.0
          token: ${{ secrets.EXPO_TOKEN }}
      # Every release is a new APK: the phones get new code only this way
      # (nothing over the air, platform/app-update.ts).
      - name: Build the APK with EAS
        if: steps.token.outputs.set == 'true'
        run: |
          npm ci
          # The app's version is the tag's (v1.3.0 → 1.3.0); EAS counts the
          # build number up by itself (eas.json, "github" profile).
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.expo.version = $v' app.json > app.json.new && mv app.json.new app.json
          mkdir -p apk
          eas build --platform android --profile github --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          curl -fsSL "$url" -o apk/Ostrich-Android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.token.outputs.set == 'true'
        with:
          name: android
          if-no-files-found: error
          path: apps/mobile-web/apk/Ostrich-Android.apk

  # The desktop app: the web app built into it (apps/desktop/scripts/
  # build-web.mjs), packed by electron-builder. Its version is the tag's.
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
          (cd apps/mobile-web && npm ci)
          cd apps/desktop
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run web
          npx electron-builder --linux AppImage deb rpm pacman --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/dist/Ostrich-Linux.*
            apps/desktop/dist/latest-linux.yml

  # Flatpak needs the Flathub runtimes, a large download: when it fails,
  # the release goes out without it.
  desktop-flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          (cd apps/mobile-web && npm ci)
          cd apps/desktop
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run web
          npx electron-builder --linux flatpak --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-flatpak
          path: apps/desktop/dist/Ostrich-Linux.flatpak

  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build
        run: |
          (cd apps/mobile-web && npm ci)
          cd apps/desktop
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run web
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/dist/Ostrich-Windows-Setup.exe
            apps/desktop/dist/Ostrich-Windows-Setup.exe.blockmap
            apps/desktop/dist/latest.yml

  publish:
    needs: [cli, android, desktop-linux, desktop-flatpak, desktop-windows]
    # The CLI is enough to publish; the apps join when they were built.
    if: ${{ !cancelled() && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # A link to a file of this release, if it was built.
          file() { [ -f "release/$1" ] && printf '[%s](%s/%s)' "$2" "$base" "$1"; }
          soon() { [ -n "$1" ] && printf '%s' "$1" || printf 'coming soon'; }
          android=$(soon "$(file Ostrich-Android.apk Ostrich-Android.apk)")
          windows=$(soon "$(file Ostrich-Windows-Setup.exe Ostrich-Windows-Setup.exe)")
          linux=$(soon "$(for f in AppImage deb rpm pacman flatpak; do file "Ostrich-Linux.$f" ".$f"; printf ' '; done | sed 's/  */ /g; s/ $//; s/) \[/), [/g')")
          cat > notes.md <<EOF
          ## Download

          | System | The app | Terminal (CLI) |
          |---|---|---|
          | **Android** | $android | |
          | **Windows** | $windows | [ostrich-windows-amd64.exe]($base/ostrich-windows-amd64.exe) |
          | **Linux** | $linux | [x86-64]($base/ostrich-linux-amd64), [ARM64]($base/ostrich-linux-arm64) or \`curl -fsSL $base/install.sh \| sh\` |
          | **macOS** | | [Apple silicon]($base/ostrich-darwin-arm64), [Intel]($base/ostrich-darwin-amd64) |
          | **iOS** | coming to the App Store | |
          | **Web** | [ostrich-messenger.online](https://ostrich-messenger.online), nothing to install | |

          - **Android:** open the APK on the phone and allow installing from that app when asked.
          - **Windows:** run the installer; Windows may warn about an unknown publisher: More info → Run anyway.
          - **Linux:** the AppImage runs anywhere (\`chmod +x Ostrich-Linux.AppImage\`, then open it); the \`.deb\` is for Ubuntu and Debian, the \`.rpm\` for Fedora and openSUSE, the \`.pacman\` for Arch (\`sudo pacman -U Ostrich-Linux.pacman\`, or from the AUR: \`yay -S ostrich-desktop-bin\`, and \`ostrich-cli-bin\` for the CLI). They all update themselves (the packages ask for your password to install the new version); the Flatpak does not yet.
          - **Updates:** the Android app offers each new APK itself; the desktop apps install new versions themselves; the CLI replaces itself with the new version once its signature checks out.

          Check a download with \`sha256sum -c SHA256SUMS\`.

          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        # A release made by hand on GitHub (which also makes the tag) gets
        # the files added to it instead.
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          # Without the signature the CLI would not update to this release.
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set: SHA256SUMS cannot be signed"
            exit 1
          fi
          key=$(mktemp)
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in release/SHA256SUMS -out release/SHA256SUMS.sig
          rm -f "$key"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Ostrich $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi

  # The AUR packages (packaging/aur), set to this release and pushed:
  # yay -S ostrich-desktop-bin / ostrich-cli-bin. Needs AUR_SSH_KEY in the
  # repository's secrets (a private key whose public key is in the AUR
  # account's SSH keys); without it, skipped.
  aur:
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Check for the AUR key
        id: key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::AUR_SSH_KEY is not set: the AUR packages are not updated"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.set == 'true'
        with:
          persist-credentials: false
      - name: Push to the AUR
        if: steps.key.outputs.set == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          pacman -Syu --noconfirm --needed git openssh perl curl
          # makepkg (for .SRCINFO) does not run as root.
          useradd -m builder
          chown -R builder .
          su builder -c "packaging/aur/update.sh $GITHUB_REF_NAME"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

          for pkg in ostrich-desktop-bin ostrich-cli-bin; do
            # A package not in the AUR yet clones empty, and is made by the push.
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/$pkg"
            cp "packaging/aur/$pkg/PKGBUILD" "packaging/aur/$pkg/.SRCINFO" "/tmp/$pkg/"
            git -C "/tmp/$pkg" add PKGBUILD .SRCINFO

            if git -C "/tmp/$pkg" diff --cached --quiet; then
              echo "$pkg: already at ${GITHUB_REF_NAME#v}"
              continue
            fi

            git -C "/tmp/$pkg" -c user.name="Ostrich" -c user.email="hello@ostrich-messenger.com" commit -q -m "${GITHUB_REF_NAME#v}"
            git -C "/tmp/$pkg" push origin HEAD:master
          done
